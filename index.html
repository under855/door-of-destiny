<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130e1c"><meta name="description" content="命運之扉・東西占卜大全｜西方塔羅與東方易經六爻互動占卜">
<title>東西占卜大全｜命運之扉</title>
<style>
:root{color-scheme:dark;--gold:#e4be79;--soft:#b9a7c3}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:#f8efe8;background:radial-gradient(ellipse at 20% 0%,#302044 0,transparent 55%),radial-gradient(ellipse at 100% 80%,#36211d 0,transparent 50%),#100c16;display:flex;align-items:center;justify-content:center;padding:25px 15px}
main{width:min(940px,100%);text-align:center}
.eyebrow{color:var(--gold);letter-spacing:.28em;font-size:12px}
h1{font-size:clamp(30px,6vw,54px);letter-spacing:.13em;margin:16px 0 8px;text-shadow:0 3px 28px #aa77493b}
.sub{font-size:14px;color:var(--soft);letter-spacing:.15em;margin-bottom:31px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
a.card{color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:330px;padding:32px 20px;border:1px solid #a8886365;border-radius:19px;background:linear-gradient(155deg,#332438e8,#19131eea);box-shadow:0 20px 46px #0007;transition:transform .2s,border-color .2s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--gold);outline:0}
.card.east{background:linear-gradient(145deg,#3c2624,#190e12)}
.symbol{font-size:62px;line-height:1.4;color:var(--gold);text-shadow:0 2px 26px #d4a65a4b}
h2{font-size:clamp(23px,4vw,30px);font-weight:600;letter-spacing:.1em;margin:8px 0}
p{line-height:1.8;color:#dbcbce;font-size:14px;margin:8px 0 18px}
.go{display:inline-block;border:1px solid #c69a63aa;border-radius:30px;padding:10px 25px;color:#f6dcae;background:#e1b97913;font-size:14px;letter-spacing:.08em}
footer{color:#9f94a3;font-size:12px;line-height:1.8;margin-top:27px}
@media(max-width:600px){.grid{grid-template-columns:1fr;gap:14px}a.card{min-height:228px;padding:19px}.symbol{font-size:42px}h2{margin:3px 0}p{margin:5px 0 12px}body{align-items:flex-start;padding-top:35px}.sub{margin-bottom:23px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">DOOR OF DESTINY</div>
<h1>東西占卜大全</h1>
<div class="sub">命運之扉 · 選擇你的占卜儀式</div>
<div class="grid">
<a class="card" href="./tarot/" aria-label="進入西方塔羅牌占卜">
<div class="symbol">✦</div><div><h2>西方占卜 · 塔羅</h2><p>洗牌、抽牌、翻牌，探索牌面象徵與啟示。</p></div><span class="go">進入塔羅占卜</span>
</a>
<a class="card east" href="./yijing/" aria-label="進入東方易經六爻占卜">
<div class="symbol">☯</div><div><h2>東方占卜 · 易經</h2><p>雙手搖龜殼，六爻成卦，解讀本卦與變卦。</p></div><span class="go">進入易經占卜</span>
</a>
</div>
<footer>僅供文化體驗、娛樂與自我反思參考，不取代專業建議。<br>© 2026 命運之扉</footer>
</main>
</body>
</html>
