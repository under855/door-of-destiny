<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>命運之扉・易經占卜</title><style>
*{box-sizing:border-box}body{margin:0;background:#120c12;color:#f3e1c4;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:480px;margin:auto;padding:18px 15px 50px}h1{text-align:center;letter-spacing:5px;font-size:29px;margin:10px}small{color:#c6a77b}header{text-align:center}.scene{position:relative;overflow:hidden;margin:20px 0;border:1px solid #73553b;border-radius:20px;height:370px;background:radial-gradient(ellipse at 50% 32%,#583a2b 0,#271920 43%,#120e14 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 40px #0008}.bagua{font-size:155px;color:#a9824b;opacity:.3;position:absolute;top:5px}.scene:before,.scene:after{content:"";position:absolute;width:12px;height:80px;bottom:60px;background:linear-gradient(#fff3b0,#c88b48 22%,#5e2722 25%);border-radius:40% 40% 3px 3px;box-shadow:0 0 22px #e7aa50}.scene:before{left:30px}.scene:after{right:30px}.shell{position:relative;z-index:1;width:112px;height:75px;background:radial-gradient(ellipse at 42% 35%,#8c6c3e,#43361e 65%,#1c190f);border:4px solid #ad8751;border-radius:52% 52% 48% 48%;box-shadow:0 12px 20px #0008;transform-origin:center}.shell:after{content:"";position:absolute;width:26px;height:12px;background:#100c0b;border:3px solid #ba9a65;border-radius:50%;bottom:-8px;left:calc(50% - 13px)}.shake .shell{animation:shake .42s ease-in-out infinite}@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(7deg)}75%{transform:translateY(3px) rotate(-7deg)}}.scene .hint{position:absolute;bottom:14px;left:12px;right:12px;text-align:center;font-size:13px;color:#eed4b4}.coinrow{z-index:2;display:flex;gap:15px;margin-top:22px;height:48px}.coin{width:42px;height:42px;border:3px solid #e1b36b;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#e6c586,#9a672b);color:#4e2e10;font-size:12px;font-weight:700;box-shadow:0 4px 8px #0007;animation:fall .5s ease-out}@keyframes fall{from{transform:translateY(-55px) rotateY(180deg);opacity:0}to{transform:translateY(0) rotateY(0);opacity:1}}.panel{background:#231720;border:1px solid #73553b;border-radius:17px;padding:16px;margin:14px 0}.actions{display:flex;gap:7px}.actions button{flex:1;min-width:0;font-size:14px;border:1px solid #ac8254;background:#592525;color:#ffe7be;border-radius:11px;padding:13px 5px}.actions button:disabled{opacity:.4}p{line-height:1.85}.muted{color:#c4a98e;font-size:13px}.hex{display:flex;gap:20px;justify-content:center;margin:15px 0}.hex section{text-align:center;flex:1}.hex h3{font-size:15px;margin:0 0 8px}.yao{display:flex;justify-content:center;gap:8px;margin:9px auto;height:7px}.bar{height:7px;background:#e8bd76;border-radius:5px;width:46px}.bar.full{width:100px}.yao.move .bar{background:#e99e70}.section{border-top:1px solid #594233;padding-top:14px;margin-top:14px}.section h3{color:#f5d69b}.tag{color:#d4a869;font-weight:bold}#result,#reading{display:none}#status{text-align:center;min-height:50px}.progress{text-align:center;letter-spacing:6px;color:#dbb17c}footer{font-size:12px;color:#aa9380;line-height:1.8;text-align:center;margin:25px 0}</style></head><body><main><header><h1>命運之扉</h1><small>東方占卜・易經六十四卦｜獨立測試版</small></header><div class="scene" id="scene"><div class="bagua">☯</div><div class="shell" aria-label="小龜殼，開口略大於銅錢"></div><div class="coinrow" id="coins"></div><div class="hint" id="hint">靜心默念所問之事，三枚銅錢，六次成卦。</div></div><div class="panel"><div class="actions"><button id="start">開始占卜</button><button id="read" disabled>命運解析</button><button id="reset" disabled>新的命運</button></div><p class="muted" id="status">準備起卦。按一次開始，即自動完成六次搖卦。</p><div class="progress" id="progress">○ ○ ○ ○ ○ ○</div></div><div class="panel" id="result"><div class="hex"><section><h3 id="pt">本卦</h3><div id="ph"></div></section><section><h3 id="ct">變卦</h3><div id="ch"></div></section></div><p id="moves" class="muted"></p></div><div class="panel" id="reading"></div><footer>本頁為易經文化體驗，不作為醫療、法律、財務等重大決策依據。<br>此測試頁與原塔羅牌 V4 分離，未修改塔羅牌主頁。</footer></main><script>
const trig=[{b:"111",n:"乾",e:"天",v:"剛健開創"},{b:"110",n:"兌",e:"澤",v:"和悅溝通"},{b:"101",n:"離",e:"火",v:"光明洞察"},{b:"100",n:"震",e:"雷",v:"發動突破"},{b:"011",n:"巽",e:"風",v:"柔順深入"},{b:"010",n:"坎",e:"水",v:"險中求通"},{b:"001",n:"艮",e:"山",v:"止定收斂"},{b:"000",n:"坤",e:"地",v:"承載包容"}];
const kw=[[1,43,14,34,9,5,26,11],[10,58,38,54,61,60,41,19],[13,49,30,55,37,63,22,36],[25,17,21,51,42,3,27,24],[44,28,50,32,57,48,18,46],[6,47,64,40,59,29,4,7],[33,31,56,62,53,39,52,15],[12,45,35,16,20,8,23,2]];
const names="乾 坤 屯 蒙 需 訟 師 比 小畜 履 泰 否 同人 大有 謙 豫 隨 蠱 臨 觀 噬嗑 賁 剝 復 無妄 大畜 頤 大過 坎 離 咸 恆 遯 大壯 晉 明夷 家人 睽 蹇 解 損 益 夬 姤 萃 升 困 井 革 鼎 震 艮 漸 歸妹 豐 旅 巽 兌 渙 節 中孚 小過 既濟 未濟".split(" ");
const themes=["剛健自強，守正而行","厚德載物，柔順蓄勢","萬事初生，先難後易","迷霧未明，求教以進","靜待其時，蓄力而發","爭端宜止，慎辨是非","整隊有紀，師出有名","親比同心，擇善而從","小有所蓄，循序前進","履險如夷，謹慎守禮","天地交泰，順勢而為","閉塞不通，守正待時","同道相助，坦誠相交","豐盛有成，持盈保泰","謙和有益，退讓得福","喜悅鼓舞，勿耽安逸","隨時應變，擇善相從","積弊當治，修舊立新","機會將至，主動接近","明察全局，先觀後動","障礙須除，明斷是非","文采修飾，重實不重表","剝落漸深，保全根本","一陽來復，重啟新局","不妄作為，守真則吉","厚積實力，待時而用","養身養心，慎言節食","負荷過重，調整支點","重重險阻，守心求通","光明洞察，辨明虛實","感應相通，以誠相待","恆心持守，久久為功","退避鋒芒，以退為進","勢強宜慎，戒躁守正","循序上升，前景漸明","光明受傷，藏器待時","內外有序，家道可成","各有異見，求同存異","行路艱難，轉向求援","結困漸解，寬緩前行","減損浮華，保全要務","有所增益，利人利己","果斷去弊，切忌遲疑","偶遇新機，慎辨誘惑","眾心匯聚，立定中心","漸進上升，踏實前行","身處困境，修德守志","修養根源，長久受益","變革當時，去舊更新","調和成器，養賢立業","驚雷乍動，安定其心","止於當止，靜定明心","漸次有序，水到渠成","關係未穩，慎定盟約","盛極當慎，戒滿戒驕","客旅在外，謹守分寸","以柔入事，循序漸進","和悅相通，善用言語","渙散待聚，化解隔閡","節制有度，立規守界","內懷誠信，感通於外","小事可為，大事宜慎","功成未穩，慎終如始","事猶未成，調整待時"];
let ls=[],running=false,done=false;const $=id=>document.getElementById(id);const pause=ms=>new Promise(r=>setTimeout(r,ms));
function toss(){const a=new Uint32Array(3);if(crypto?.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<3;i++)a[i]=Math.floor(Math.random()*2);return Array.from(a,x=>2+(x%2));}
function getHex(lines,change=false){const bits=lines.map(x=>change&&x.move?!x.yang:x.yang).map(Boolean).map(Number).join("");const lo=trig.find(x=>x.b===bits.slice(0,3)),up=trig.find(x=>x.b===bits.slice(3));const num=kw[trig.indexOf(up)][trig.indexOf(lo)];return {num,name:names[num-1],theme:themes[num-1],up,lo};}
function draw(el,lines){$(el).innerHTML=lines.slice().reverse().map(x=>'<div class="yao '+(x.move?'move':'')+'">'+(x.yang?'<span class="bar full"></span>':'<span class="bar"></span><span class="bar"></span>')+'</div>').join("");}
function info(h){return "第"+h.num+"卦・"+h.name+"（上"+h.up.n+"下"+h.lo.n+"）";}
async function start(){if(running)return;running=true;done=false;ls=[];$("start").disabled=true;$("read").disabled=true;$("reset").disabled=true;$("result").style.display="none";$("reading").style.display="none";for(let i=0;i<6;i++){$("scene").classList.add("shake");$("coins").innerHTML="";$("hint").textContent="第 "+(i+1)+" 次搖卦中……";await pause(750);const vals=toss();$("scene").classList.remove("shake");$("coins").innerHTML=vals.map(v=>'<div class="coin">'+(v===3?"正":"反")+'</div>').join("");const sum=vals.reduce((a,b)=>a+b,0);const line={sum,yang:sum%2===1,move:sum===6||sum===9};ls.push(line);$("progress").textContent=Array.from({length:6},(_,j)=>j<=i?"●":"○").join(" ");$("status").textContent="第 "+(i+1)+" 爻：三枚銅錢合數 "+sum+"，"+({6:"老陰（動）",7:"少陽",8:"少陰",9:"老陽（動）"}[sum]);await pause(650);}const a=getHex(ls),b=getHex(ls,true);$("pt").textContent="本卦・"+a.name;$("ct").textContent="變卦・"+b.name;draw("ph",ls);draw("ch",ls.map(x=>({...x,yang:x.move?!x.yang:x.yang,move:false})));const m=ls.map((x,i)=>x.move?i+1:null).filter(Boolean);$("moves").textContent="本卦："+info(a)+"；變卦："+info(b)+"。動爻："+(m.length?m.join("、")+"爻":"無");$("result").style.display="block";$("hint").textContent="六爻已成，按「命運解析」揭示卦意。";$("read").disabled=false;$("reset").disabled=false;running=false;done=true;}
function read(){if(!done)return;const a=getHex(ls),b=getHex(ls,true),m=ls.map((x,i)=>x.move?i+1:null).filter(Boolean);$("reading").innerHTML='<div class="section"><h3>簡單解析</h3><p><span class="tag">'+info(a)+'</span></p><p>'+a.theme+'。</p><p>白話：此時最重要的是看清局勢，按照卦意調整做法。'+(m.length?'變卦為「'+b.name+'」，顯示後續仍有轉變。':'本次沒有動爻，宜以本卦為主。')+'</p></div><div class="section"><h3>較深解析・古風卦辭</h3><p>卦成於六爻，象見於天地。上卦為'+a.up.n+'，象'+a.up.e+'，其德在'+a.up.v+'；下卦為'+a.lo.n+'，象'+a.lo.e+'，其義在'+a.lo.v+'。內外相參，進退之機，由此可察。</p><p>夫「'+a.name+'」之象，'+a.theme+'。行事當辨其時，守其正，審其勢，勿以一時之喜懼而亂其方寸。</p><p>動爻：'+(m.length?'第'+m.join("、")+'爻有變。動則生機，宜察其所處之位；初爻近始，上爻近終，所問之事須兼顧始末。':'六爻皆靜，重在審視本局，不宜妄求變動。')+'</p><p>變卦：'+(m.length?'由「'+a.name+'」之局，化為「'+b.name+'」。其象曰「'+b.theme+'」，提示未來走向，但並非不可更易之定數。':'無動爻，本卦之意為此次占問主軸。')+'</p><p><span class="tag">處世</span> 凡事先觀其本，再決其行；可進則進，宜守則守。莫求一夕之功，而失長久之道。</p><p><span class="tag">感情</span> 以誠相待，明辨彼此心意。關係未明時，宜先溝通，不宜憑一卦代替對方真實的想法。</p><p><span class="tag">事業</span> 上下卦互見內外之勢。先盤點現有資源與阻礙，再定步驟，避免倉促行事。</p><p><span class="tag">財運</span> 財有進退，務須衡量風險。此卦宜作反思，不宜作為單獨買賣依據。</p><p><span class="tag">卜者寄語</span> 天機不在吉凶二字，而在知所當為。卦已示象，路仍由君行。</p></div><p class="muted">此為試作版的自撰解讀，並非《周易》原文卦辭或爻辭；正式版需逐卦補入校核後的經文與專屬解說。</p>';$("reading").style.display="block";$("read").disabled=true;$("hint").textContent="天機已啟。若欲再問，請按「新的命運」。";$("reading").scrollIntoView({behavior:"smooth",block:"start"});}
function reset(){if(running)return;ls=[];done=false;$("coins").innerHTML="";$("progress").textContent="○ ○ ○ ○ ○ ○";$("status").textContent="準備起卦。按一次開始，即自動完成六次搖卦。";$("hint").textContent="靜心默念所問之事，三枚銅錢，六次成卦。";$("result").style.display="none";$("reading").style.display="none";$("start").disabled=false;$("read").disabled=true;$("reset").disabled=true;}
$("start").addEventListener("click",start);$("read").addEventListener("click",read);$("reset").addEventListener("click",reset);
</script></body></html>
