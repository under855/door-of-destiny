.vignette{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,4,4,.08),rgba(12,6,6,0) 25%,rgba(38,10,12,.05) 45%,rgba(55,18,31,.16) 70%,rgba(35,8,17,.42) 100%)}
.overlay-ui{position:relative;left:auto;right:auto;bottom:auto;padding:11px 6px 4px;background:none}
.message{text-align:center;font-size:13px;line-height:1.7;color:#f3dcc2;min-height:0;margin-bottom:4px}
.progress{display:flex;justify-content:center;gap:8px;margin:5px 0 6px;flex-wrap:wrap}.progress span{width:12px;height:12px;border-radius:50%;border:1px solid #b08958;background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}.progress span.on{background:var(--gold);box-shadow:0 0 10px rgba(232,194,123,.5)}
.coins{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;justify-content:center;pointer-events:none}
.coin{width:48px;height:48px;border-radius:50%;display:none;position:relative;transform-style:preserve-3d;box-shadow:0 8px 18px rgba(0,0,0,.35)}.coin.show{display:block;animation:coinPop .55s ease both}.coin.toss{animation:coinFlip .72s ease both}
.coin .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;backface-visibility:hidden;border:2px solid #c59a58;background:radial-gradient(circle at 32% 28%,#f5dfa6 0,#c39751 33%,#96632c 69%,#563816 100%);color:#5a320d}.coin .back{transform:rotateY(180deg)}
.coin .face::after{content:"";position:absolute;inset:11px;border:2px solid rgba(91,49,12,.82);border-radius:50%;opacity:.65}.coin .hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:#4b2d15}.coin .mark{position:relative;z-index:2;transform:translateY(-13px);font-size:12px;letter-spacing:1px;text-shadow:0 1px 1px rgba(255,255,255,.35)}.coin.reverse .front{transform:rotateY(180deg)}.coin.reverse .back{transform:rotateY(0deg)}

function lineFromSum(sum){

    const lab=document.createElement('div'); lab.textContent=`${['初','二','三','四','五','上'][i]}爻 · ${l.name}`; lineLabels.appendChild(lab);
  }
  const primary = hexFromLines(lines,false); const changed = hexFromLines(lines,true); const moving = movingPositions(lines);
  primaryText.textContent = `${primary.fullName}（第${primary.num}卦）`;
  changedText.textContent = moving.length? `${changed.fullName}（第${changed.num}卦）` : '本次無動爻，以本卦為主';
  movingText.textContent = moving.length? `第 ${moving.join('、')} 爻` : '無';
}
function guaMood(primary, changed, mvCount){
  if(mvCount===0) return '卦氣穩定，此番天機重在看清當下，不在劇烈轉折。';
  if(mvCount<=2) return `動爻不多，意味轉機已現，但仍可由你的選擇調整走向；由「${primary.meta.title}」漸轉「${changed.meta.title}」，是細水長流的變化。`;
  if(mvCount<=4) return `動爻過半，事情正在明顯轉動；由「${primary.meta.title}」化向「${changed.meta.title}」，局勢不是定局，而是正在改寫。`;
  return `多爻變動，顯示外境與內心都在翻湧，現況不宜固執死守；先穩住腳步，再迎接「${changed.meta.title}」的新局。`;
}
function buildSections(){
  const primary = hexFromLines(lines,false); const changed = hexFromLines(lines,true); const moving = movingPositions(lines);
  const simple = `<div class="section"><h3>簡單解析</h3><p><span class="tag">本卦</span><span class="tag">${primary.fullName}</span><span class="tag">第${primary.num}卦</span></p><p>這一卦的核心訊息是：${primary.meta.theme}</p><p>白話來說：${primary.meta.advice}</p>${moving.length?`<p>本次有動爻，局勢會由「${primary.fullName}」推進到「${changed.fullName}」，表示事情不只停留在眼前，後續還會有轉折。</p>`:`<p>本次無動爻，重點在於老老實實面對當下，不必過度追逐第二層答案。</p>`}</div>`;
  const moveText = moving.length ? `動爻落在第 ${moving.join('、')} 爻，代表變化點已經出現。愈靠近下方，愈偏向事情起步與內在動機；愈靠近上方，愈偏向局勢成熟、結果顯現與外部關係。` : '本次沒有動爻，表示局勢相對穩定，重心不在翻盤，而在你如何理解並回應此刻的卦意。';
  const deep = `<div class="section"><h3>較深解析</h3>
    <p><span class="tag">卦象總論</span></p>
    <p>本卦為「${primary.fullName}」。上卦 ${primary.upper.name}（${primary.upper.nature}）主 ${primary.upper.mean}；下卦 ${primary.lower.name}（${primary.lower.nature}）主 ${primary.lower.mean}。這代表外在局勢與你內在狀態正在彼此映照：內在若亂，外局便難穩；內心若定，許多路會自己浮現。</p>
    <p>${primary.meta.theme} ${primary.meta.advice}</p>
    <p>${guaMood(primary, changed, moving.length)}</p>
    <p>${moveText}</p>
    <p><span class="tag">感情</span> 感情上，宜以「${primary.lower.short}」處理自己真正的感受，再以「${primary.upper.short}」面對對方與外在互動。若想更進一步，先把心意講清楚；若已感疲累，則應先整頓界線，別在情緒未明時勉強承諾。</p>
    <p><span class="tag">事業</span> 工作與目標方面，此卦重點不只在效率，更在方法。你現在最該做的，不是一口氣衝到終點，而是看懂此局該先做哪一步、該避開哪一個錯誤。只要節奏抓對，後續自然會比你想像中更順。</p>
    <p><span class="tag">財運</span> 財務上宜守中求進。若卦意偏開展，可把握正當機會；若卦意偏收斂，則先整理支出、收束風險、避免情緒性消費與衝動投資。穩住本金，比追逐虛旺更重要。</p>
    <p><span class="tag">行動建議</span> 命運不是直接替你下命令，而是指出眼前最值得修正的一步。請把「${primary.meta.title}」當成此刻的天機提醒：今天就先完成一個最具體的小行動，卦象才會真正落地，而不是停留在好聽的話語之中。</p>
    ${moving.length?`<p><span class="tag">變卦走向</span> 變卦為「${changed.fullName}」。它提醒你：只要你順著本卦修正方向，局勢將逐步轉向「${changed.meta.theme}」。換句話說，眼前的狀態不是終局，而是通往下一個局面的門檻。</p>`:''}
  </div>`;
  analysis.innerHTML = simple + deep;
}
async function startDivination(){
  if(phase==='running') return;
  phase='running'; lines=[]; analysis.classList.remove('show'); analysis.innerHTML=''; hexBox.classList.remove('show');
  startBtn.disabled=true; analyzeBtn.disabled=true; resetBtn.disabled=true; initProgress(); setProgress(0);
  message.textContent='卜者已靜心持殼，銅錢將六次落下，天機自會成象。';
  statusEl.textContent='起卦中…… 每次將擲出三枚銅錢，共六次成卦。';
  for(let i=0;i<6;i++){
    syncShell(); scene.classList.add('shaking'); message.textContent = `第 ${i+1} 次起爻：龜殼輕搖，靜待銅錢落定。`;
    await sleep(950);
    const vals=[randomCoin(),randomCoin(),randomCoin()]; renderCoins(vals,true); await sleep(800); scene.classList.remove('shaking');
    const sum=vals.reduce((a,b)=>a+b,0); const line=lineFromSum(sum); lines.push({...line, coins:vals}); setProgress(i+1);
    const coinDesc = vals.map(v=>v===3?'正':'反').join('、'); statusEl.textContent = `第 ${i+1} 爻完成：${coinDesc}，合數 ${sum}，判為「${line.name}」。`;
    await sleep(680); clearCoins(); await sleep(220);
  }
  renderHexPreview(); const primary = hexFromLines(lines,false); const moving = movingPositions(lines);
  message.textContent = `卦象已成：${primary.fullName}。若你願意，按下「命運解析」，讓天意慢慢說給你聽。`;
  statusEl.textContent = moving.length ? `本卦已完成，並出現 ${moving.length} 個動爻。可查看較完整解析。` : '本卦已完成，本次無動爻，以本卦為主要解讀。';
  analyzeBtn.disabled=false; resetBtn.disabled=false; phase='done';
}
function showAnalysis(){ if(phase!=='done') return; buildSections(); analysis.classList.add('show'); analyzeBtn.disabled=true; message.textContent='天機已啟，先看簡解，再讀深解。若還想再問一次，按下「新的命運」。'; statusEl.textContent='解析已展開。內容分為簡單解析與較深解析兩層。'; }
function resetAll(){ phase='idle'; lines=[]; clearCoins(); initProgress(); setProgress(0); scene.classList.remove('shaking'); startBtn.disabled=false; analyzeBtn.disabled=true; resetBtn.disabled=true; analysis.classList.remove('show'); analysis.innerHTML=''; hexBox.classList.remove('show'); message.textContent='心中默念想問之事。按下「開始占卜」，將以三枚銅錢、六次成卦。'; statusEl.textContent='尚未起卦。結果將以本卦、動爻、變卦與古風解讀呈現。'; }
startBtn.addEventListener('click', startDivination); analyzeBtn.addEventListener('click', showAnalysis); resetBtn.addEventListener('click', resetAll); initProgress();
</script>
